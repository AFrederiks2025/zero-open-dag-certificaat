<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZERO Freerunning — Certificaatgenerator</title>
  <link rel="stylesheet" href="certificaat.css" />
</head>
<body>
  <div class="no-print">
    <div class="ui-header">
      <div>
        <h1>ZERO Freerunning — Certificaten</h1>
        <p>Vul de naam in voor de open dag en print of sla op als PDF.</p>
      </div>
    </div>

    <form class="form-card" id="cert-form" autocomplete="off">
      <div class="form-grid">
        <div class="field">
          <label for="naam">Naam deelnemer</label>
          <input id="naam" name="naam" type="text" placeholder="bijv. Emma de Vries" required />
        </div>
        <div class="field">
          <label for="datum">Datum</label>
          <input id="datum" name="datum" type="date" required />
        </div>
        <div class="field">
          <label>Handtekening</label>
          <p class="field-note">Staat al op het certificaat (jouw handtekening).</p>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Genereer certificaat</button>
        <button type="button" class="btn btn-secondary" id="btn-print">Print / PDF</button>
        <button type="button" class="btn btn-ghost" id="btn-reset">Reset</button>
      </div>
      <p class="hint">Tip: bij printen “Opslaan als PDF”, A4, liggend, marges “Geen”, achtergrondgraphics aan.</p>
    </form>

    <div class="preview-label">Voorbeeld / preview</div>
  </div>

  <div class="stage">
    <article class="certificate" id="certificate" aria-label="Certificaat ZERO Freerunning">
      <img class="cert-bg" src="certificaat-bg.jpg" alt="" />

      <!-- Overlays op het echte ontwerp -->
      <div class="overlay overlay-datum" id="out-datum"></div>
      <div class="overlay overlay-naam" id="out-naam"></div>
      <!-- Vervangt de oude handtekening op het ontwerp door jouw upload -->
      <img class="overlay-handtekening" id="out-handtekening" src="handtekening.png" alt="" />
    </article>
  </div>

  <script>
    (function () {
      const form = document.getElementById('cert-form');
      const naamInput = document.getElementById('naam');
      const datumInput = document.getElementById('datum');
      const outNaam = document.getElementById('out-naam');
      const outDatum = document.getElementById('out-datum');

      const NL_MONTHS = [
        'januari', 'februari', 'maart', 'april', 'mei', 'juni',
        'juli', 'augustus', 'september', 'oktober', 'november', 'december'
      ];

      function formatDutchDate(iso) {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);
        if (!y || !m || !d) return iso;
        return d + ' ' + NL_MONTHS[m - 1] + ' ' + y;
      }

      function todayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }

      function applyCertificate() {
        const naam = (naamInput.value || '').trim();
        outNaam.textContent = naam;
        outDatum.textContent = formatDutchDate(datumInput.value);
      }

      function syncUrl() {
        const params = new URLSearchParams();
        const naam = (naamInput.value || '').trim();
        const datum = (datumInput.value || '').trim();
        if (naam) params.set('naam', naam);
        if (datum) params.set('datum', datum);
        const qs = params.toString();
        const next = qs ? (window.location.pathname + '?' + qs) : window.location.pathname;
        window.history.replaceState(null, '', next);
      }

      function refresh() {
        applyCertificate();
        syncUrl();
      }

      datumInput.value = todayISO();
      naamInput.addEventListener('input', refresh);
      datumInput.addEventListener('input', refresh);

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        refresh();
        document.getElementById('certificate').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('btn-print').addEventListener('click', function () {
        refresh();
        window.print();
      });

      document.getElementById('btn-reset').addEventListener('click', function () {
        naamInput.value = '';
        datumInput.value = todayISO();
        refresh();
        naamInput.focus();
      });

      const params = new URLSearchParams(window.location.search);
      if (params.has('naam')) naamInput.value = params.get('naam');
      if (params.has('datum')) datumInput.value = params.get('datum');
      refresh();
    })();
  </script>
</body>
</html>
